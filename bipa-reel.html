<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Bipa + EXP · Reels</title>
<style>
  @font-face{font-family:Geist;src:url(fonts/Geist-Regular.woff2) format('woff2');font-weight:400}
  @font-face{font-family:Geist;src:url(fonts/Geist-Medium.woff2) format('woff2');font-weight:500}
  @font-face{font-family:Geist;src:url(fonts/Geist-SemiBold.woff2) format('woff2');font-weight:600}
  @font-face{font-family:Geist;src:url(fonts/Geist-Bold.woff2) format('woff2');font-weight:700}
  @font-face{font-family:GeistMono;src:url(fonts/GeistMono-Regular.woff2) format('woff2');font-weight:400}
  @font-face{font-family:GeistMono;src:url(fonts/GeistMono-Medium.woff2) format('woff2');font-weight:500}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#050404}
  body{font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  .abs{position:absolute}
  #bg{position:absolute;inset:0}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #glow{filter:blur(18px);opacity:.75;mix-blend-mode:screen}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
  .mono{font-family:GeistMono,monospace;text-transform:uppercase;letter-spacing:.26em}
  .lbl{left:0;width:1080px;text-align:center;font-size:30px;color:#FF7433}
  .lbl i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#FF4D00;box-shadow:0 0 18px #FF4D00;margin-right:18px;vertical-align:2px}
  .line{left:0;width:1080px;text-align:center;overflow:hidden;height:1.06em;line-height:1.06}
  .line span{display:inline-block}
  .h{font-size:118px;font-weight:600;letter-spacing:-.045em;text-transform:uppercase}
  .h em{font-style:normal;color:#FF4D00}
  .tick{left:0;width:1080px;height:84px;overflow:hidden;text-align:center}
  .tick div{position:absolute;left:0;width:1080px;font-size:58px;font-weight:500;letter-spacing:-.02em;color:#EDE6E1}
  .tick b{display:inline-block;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#FF4D00,#FF9C74);margin-right:22px;vertical-align:-6px;position:relative}
  .tick b:after{content:"";position:absolute;left:15px;top:10px;width:12px;height:21px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
  .pill{left:190px;width:700px;height:132px;border-radius:66px;background:linear-gradient(90deg,#FF4D00,#FF8A55);display:flex;align-items:center;justify-content:center;gap:22px;font-size:44px;font-weight:600;letter-spacing:.06em;box-shadow:0 0 60px rgba(255,77,0,.55),0 0 160px rgba(255,77,0,.25)}
  .pill svg{width:40px;height:40px}
  .sub{left:0;width:1080px;text-align:center;font-size:28px;color:rgba(255,255,255,.62)}
  .end{left:0;width:1080px;text-align:center;font-size:96px;font-weight:600;letter-spacing:-.045em;line-height:1.02}
  .end em{font-style:normal;color:#FF4D00}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="glow" width="540" height="960"></canvas>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="flash"></div>

<div class="abs mono lbl" id="lbl" style="top:150px"><i></i>Nova parceria</div>
<div class="abs mono lbl" id="cap" style="top:1010px;color:rgba(255,255,255,.7);font-size:28px">Bipa Business&nbsp;&nbsp;<span style="color:#FF4D00">+</span>&nbsp;&nbsp;EXP Digital</div>

<div id="head">
  <div class="abs line h" id="h1" style="top:1095px"><span>Infraestrutura</span></div>
  <div class="abs line h" id="h2" style="top:1220px"><span>bancária</span></div>
  <div class="abs line h" id="h3" style="top:1345px"><span>da <em>EXP.</em></span></div>
</div>
<div class="abs tick" id="tick" style="top:1560px"></div>

<div id="endc">
  <div class="abs end" id="e1" style="top:1110px">Sua conta PJ,<br>com a <em>EXP.</em></div>
  <div class="abs pill" id="e2" style="top:1420px">CRIAR CONTA
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></div>
  <div class="abs mono sub" id="e3" style="top:1610px">Link na bio · expdigital.io/bipa</div>
</div>

<script>
const DUR = 15;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inOutC = x => (x = clamp(x, 0, 1), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outQ = x => (x = clamp(x, 0, 1), 1 - Math.pow(1 - x, 4));
const outBack = x => { x = clamp(x, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// ---------- PRNG determinístico (o render precisa ser igual em todo quadro)
let seed = 20261124;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function gauss() { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// ---------- Desenho: Bipa em cima, EXP embaixo (mesmos traços da página)
const SB = 0.95, BW = 1.2, BX = 500 - 340 * SB * BW, BY = 620 - 325 * SB;
const ES = 5.2, EX = 540 - 57 * ES, EY = 1010;
const mapB = (x, y) => [BX + x * SB * BW, BY + y * SB];
const mapE = (x, y) => [EX + x * ES, EY + y * ES];
const mapId = (x, y) => [x, y];
const ORANGE = [[0, '#FF4D00'], [0.6, '#FF7433'], [1, '#FF9C74']];
const SPIRAL = [[0, '#5BD04A'], [0.17, '#E8D51E'], [0.3, '#F9B81C'], [0.42, '#FA8A2A'], [0.52, '#FF4B4B'], [0.62, '#D53F9E'], [0.72, '#9A3BDE'], [0.86, '#6B42EE'], [1, '#3B84F0']];
const B0 = mapB(60, 65), B1 = mapB(60, 610), E0 = mapE(9.5, 57);
const segs = [
  { d: `M -160 40 C 60 120, ${B0[0] - 220} ${B0[1] - 90}, ${B0[0] - 40} ${B0[1] - 8} S ${B0[0] - 8} ${B0[1]}, ${B0[0]} ${B0[1]}`, map: mapId, w: 5, kind: 'lead', grad: [[0, '#2a4a1e'], [1, '#5BD04A']], g: 0 },
  { d: 'M60 65 C 250 10, 640 30, 640 200 C 640 330, 470 405, 280 405 C 120 405, 30 380, 30 335 C 30 285, 150 265, 290 265 C 470 265, 650 340, 650 470 C 650 600, 470 640, 300 640 C 190 640, 110 625, 60 610', map: mapB, w: 62 * SB, kind: 'band', grad: SPIRAL, g: 0 },
  { d: `M${B1[0]} ${B1[1]} C ${B1[0] - 120} ${B1[1] + 90}, ${E0[0] - 140} ${E0[1] - 120}, ${E0[0]} ${E0[1]}`, map: mapId, w: 8, kind: 'thread', grad: [[0, '#3B84F0'], [0.5, '#C04BE0'], [1, '#FF4D00']], g: 1 },
  { d: 'M9.5 57 A47.5 47.5 0 0 1 57 9.5 L95 9.5', map: mapE, w: 19 * ES, kind: 'band', grad: [[0, '#FF4D00'], [1, '#FF6A1F']], g: 2 },
  { d: 'M95 9.5 Q104 10 104.5 19', map: mapE, w: 6, kind: 'thread', grad: [[0, '#FF6A1F'], [1, '#FF6A1F']], g: 2 },
  { d: 'M104.5 19 A28.5 28.5 0 0 1 76 47.5 L45.87 47.5 A19 19 0 0 0 45.87 85.5 L76 85.5 A28.5 28.5 0 0 0 104.5 57', map: mapE, w: 19 * ES, kind: 'band', grad: ORANGE, g: 2 }
];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function gradAt(g, t) {
  for (let i = 1; i < g.length; i++) if (t <= g[i][0]) {
    const a = g[i - 1], b = g[i], k = (t - a[0]) / ((b[0] - a[0]) || 1), A = hex(a[1]), B = hex(b[1]);
    return [A[0] + (B[0] - A[0]) * k | 0, A[1] + (B[1] - A[1]) * k | 0, A[2] + (B[2] - A[2]) * k | 0];
  }
  return hex(g[g.length - 1][1]);
}
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('style', 'position:absolute;width:0;height:0'); document.body.appendChild(svg);
let total = 0;
for (const s of segs) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', s.d); svg.appendChild(p);
  const L = p.getTotalLength(), N = 900, pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength(L * i / N); pts.push(s.map(q.x, q.y)); }
  let len = 0; for (let i = 1; i <= N; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  s.pts = pts; s.len = len; s.weight = len * (s.kind === 'thread' ? 0.6 : s.kind === 'lead' ? 0.35 : 1); total += s.weight;
}
svg.remove();
let acc = 0; for (const s of segs) { s.t0 = acc / total; acc += s.weight; s.t1 = acc / total; }
function sample(s, u) {
  const f = u * (s.pts.length - 1), i = Math.min(s.pts.length - 2, f | 0), k = f - i;
  const a = s.pts[i], b = s.pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
  return { x: a[0] + dx * k, y: a[1] + dy * k, nx: -dy / m, ny: dx / m };
}
function headAt(P) {
  for (const s of segs) if (P <= s.t1) { const u = (P - s.t0) / ((s.t1 - s.t0) || 1); return { p: sample(s, u), c: gradAt(s.grad, u), g: s.g, u }; }
  const l = segs[segs.length - 1]; return { p: sample(l, 1), c: gradAt(l.grad, 1), g: l.g, u: 1 };
}

// partículas
const parts = [];
for (const s of segs) {
  const n = Math.round(s.kind === 'band' ? s.len * s.w * (s.g === 2 ? 0.036 : 0.05) : s.len * (s.kind === 'lead' ? 0.9 : 1.5));
  for (let i = 0; i < n; i++) {
    const u = rnd(), pt = sample(s, u);
    const off = s.kind === 'band' ? (rnd() - 0.5) * s.w * 0.94 + gauss() * s.w * 0.05 : gauss() * s.w * 0.35;
    const c = gradAt(s.grad, u);
    parts.push({ g: s.g, gu: u, t: s.t0 + u * (s.t1 - s.t0), x: pt.x + pt.nx * off, y: pt.y + pt.ny * off,
      r: s.kind === 'band' ? 1.1 + rnd() * 1.3 : 0.9 + rnd() * 0.8,
      a: s.kind === 'band' ? 0.45 + rnd() * 0.55 : s.kind === 'lead' ? 0.3 + rnd() * 0.35 : 0.5 + rnd() * 0.4,
      ph: rnd() * 6.283, sp: 0.8 + rnd() * 2.2, bx: gauss(), by: gauss(),
      c: `rgb(${(c[0] >> 3) << 3},${(c[1] >> 3) << 3},${(c[2] >> 3) << 3})` });
  }
}
parts.sort((a, b) => a.t - b.t);
// poeira de fundo
const dust = [];
for (let i = 0; i < 220; i++) dust.push({ x: rnd() * 1080, y: rnd() * 1920, z: 0.3 + rnd() * 0.7, ph: rnd() * 6.28, r: 0.6 + rnd() * 1.4 });

// centros de cada logo (para a explosão do "hit")
const CB = [540, 620], CE = [540, 1010 + 48 * ES];

// ---------- linha do tempo (120 BPM, 1 batida = 0,5 s)
const T_DRAW0 = 0.0, T_DRAW1 = 6.6, T_HIT = 7.0;
const TICKS = ['Conta PJ', 'Pix no CNPJ', 'Link de pagamento', 'Cobrança recorrente', 'Boletos', 'Extrato pro contador'];
const T_TICK = 9.0;   // uma por batida
$('tick').innerHTML = TICKS.map(s => `<div><b></b>${s}</div>`).join('');

const cv = $('cv'), ctx = cv.getContext('2d');
const gl = $('glow'), gctx = gl.getContext('2d');

function cam(t) {
  // empurrão lento enquanto desenha → recua e sobe depois do hit
  const push = 1 + 0.05 * inOutC(span(t, 0, T_DRAW1));
  const k2 = inOutC(span(t, 7.35, 8.25));
  const k = lerp(push, 0.62, k2);
  const cx = 540, cy = lerp(940, 640, k2);           // ponto da tela onde fica o centro do desenho
  let sx = 0, sy = 0;
  if (t > T_HIT && t < T_HIT + 0.45) { const e = Math.exp(-(t - T_HIT) * 9) * 9; sx = Math.sin(t * 91) * e; sy = Math.cos(t * 77) * e; }
  return { k, tx: cx - 540 * k + sx, ty: cy - lerp(940, 915, k2) * k + sy };
}

function draw(t) {
  const lin = span(t, T_DRAW0, T_DRAW1), P = 0.35 * lin + 0.65 * inOutC(lin), done = t >= T_DRAW1;   // começa já em movimento (gancho do Reels)
  const loopT = done ? ((t - T_DRAW1) % 3.2) / 3.2 : -1;
  const C = cam(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1080, 1920);
  ctx.globalCompositeOperation = 'lighter';

  // poeira (parallax leve)
  for (const d of dust) {
    const y = (d.y - t * 14 * d.z + 1920) % 1920, x = d.x + Math.sin(t * 0.4 + d.ph) * 6;
    ctx.globalAlpha = 0.12 + 0.18 * d.z * (0.6 + 0.4 * Math.sin(t * 1.7 + d.ph));
    ctx.fillStyle = '#FFB089'; ctx.beginPath(); ctx.arc(x, y, d.r, 0, 6.283); ctx.fill();
  }

  ctx.setTransform(C.k, 0, 0, C.k, C.tx, C.ty);
  // flutuação suave de cada marca
  const FB = [Math.sin(t * 0.9) * 3, Math.sin(t * 1.15 + 0.8) * 5], FE = [Math.sin(t * 0.8 + 2.1) * 3, Math.sin(t * 1.05 + 2.9) * 5];
  const hitE = t > T_HIT ? Math.exp(-(t - T_HIT) * 4.2) * Math.sin(Math.min(1, (t - T_HIT) * 6) * Math.PI / 2) : 0;
  let lastC = '';
  for (let i = 0; i < parts.length; i++) {
    const q = parts[i]; if (q.t > P) break;
    const born = done ? 9 : (P - q.t) * 6.3 / 1;         // ~em "segundos de traço"
    const fresh = born < 0.06 ? 1 - born / 0.06 : 0;
    const tw = 0.62 + 0.38 * Math.sin(t * q.sp + q.ph);
    let boost = 0;
    if (loopT >= 0) { let dl = loopT - q.t; if (dl < 0) dl += 1; if (dl < 0.035) boost = 1 - dl / 0.035; }
    // explosão do hit: cada ponto sai do centro da sua marca e volta com mola
    const cc = q.g === 0 ? CB : CE, ex = q.x - cc[0], ey = q.y - cc[1];
    const hx = (ex * 0.09 + q.bx * 10) * hitE, hy = (ey * 0.09 + q.by * 10) * hitE;
    const fo = q.g === 0 ? FB : q.g === 2 ? FE : [lerp(FB[0], FE[0], q.gu), lerp(FB[1], FE[1], q.gu)];
    const wob = Math.sin(t * 1.3 + q.ph) * 0.9;
    const col = fresh > 0.3 ? '#FFFFFF' : q.c;
    if (col !== lastC) { ctx.fillStyle = col; lastC = col; }
    ctx.globalAlpha = Math.min(1, q.a * tw * (1 + fresh * 0.8) + boost * 0.45 + hitE * 0.25);
    ctx.beginPath(); ctx.arc(q.x + wob + fo[0] + hx, q.y - wob + fo[1] + hy, q.r * (1 + boost * 0.35 + fresh * 0.6), 0, 6.283); ctx.fill();
  }

  // cabeça do cometa: risco fino e brilhante
  const hp = !done ? (t > T_DRAW0 + 0.02 ? P : -1) : loopT;
  if (hp >= 0) {
    const LEN = done ? 0.03 : 0.022, STEPS = 26; let prev = null;
    ctx.lineCap = 'round';
    for (let j = 0; j <= STEPS; j++) {
      let t2 = hp - LEN * (1 - j / STEPS); if (t2 < 0) { if (!done) continue; t2 += 1; }
      const h = headAt(t2), f = j / STEPS;
      const fo = h.g === 0 ? FB : h.g === 2 ? FE : [lerp(FB[0], FE[0], h.u), lerp(FB[1], FE[1], h.u)];
      const p = { x: h.p.x + fo[0], y: h.p.y + fo[1] };
      if (prev) {
        ctx.globalAlpha = (done ? 0.55 : 1) * (0.12 + 0.88 * f * f);
        ctx.strokeStyle = `rgb(${Math.round(h.c[0] + (255 - h.c[0]) * f * .8)},${Math.round(h.c[1] + (255 - h.c[1]) * f * .8)},${Math.round(h.c[2] + (255 - h.c[2]) * f * .8)})`;
        ctx.lineWidth = 1.2 + 3.4 * f;
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      prev = p;
    }
    const hh = headAt(hp), fo = hh.g === 0 ? FB : hh.g === 2 ? FE : [lerp(FB[0], FE[0], hh.u), lerp(FB[1], FE[1], hh.u)];
    const px = hh.p.x + fo[0], py = hh.p.y + fo[1], R = done ? 22 : 34;
    const g = ctx.createRadialGradient(px, py, 0, px, py, R);
    g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(0.25, `rgba(${hh.c},.5)`); g.addColorStop(1, `rgba(${hh.c},0)`);
    ctx.globalAlpha = done ? 0.6 : 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, R, 0, 6.283); ctx.fill();
  }

  // onda de choque do hit
  if (t > T_HIT && t < T_HIT + 0.9) {
    const u = (t - T_HIT) / 0.9;
    for (const [cc, col] of [[CB, '200,120,255'], [CE, '255,110,40']]) {
      for (const [dl, w] of [[0, 1], [0.12, 0.5]]) {
        const v = clamp((u - dl) / (1 - dl), 0, 1); if (v <= 0) continue;
        ctx.globalAlpha = Math.pow(1 - v, 2) * 0.45 * w; ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 1.5 + 5 * (1 - v);
        ctx.beginPath(); ctx.arc(cc[0], cc[1], 80 + outQ(v) * 700, 0, 6.283); ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // brilho (bloom) a partir do próprio quadro
  gctx.clearRect(0, 0, 540, 960); gctx.globalAlpha = 1; gctx.drawImage(cv, 0, 0, 540, 960);
}

function setT(el, y, o, s) { el.style.transform = `translateY(${y}px)` + (s ? ` scale(${s})` : ''); el.style.opacity = o; }

function seek(t) {
  t = clamp(t, 0, DUR);
  draw(t);
  // fundo: lavagens de cor que respiram
  const a = 0.5 + 0.5 * Math.sin(t * 0.8);
  $('bg').style.background =
    `radial-gradient(900px 900px at 30% ${lerp(30, 22, span(t, 7.3, 8.3))}%, rgba(110,60,230,${(0.10 + 0.05 * a).toFixed(3)}), transparent 70%),` +
    `radial-gradient(1000px 1000px at 72% ${lerp(62, 34, span(t, 7.3, 8.3))}%, rgba(255,77,0,${(0.10 + 0.06 * (1 - a)).toFixed(3)}), transparent 70%), #050404`;
  // flash do hit
  $('flash').style.opacity = t > T_HIT ? (Math.exp(-(t - T_HIT) * 16) * 0.55).toFixed(3) : 0;

  // rótulo "Nova parceria" (topo)
  const lo = span(t, 0.2, 0.8) * (1 - span(t, 6.9, 7.2));
  setT($('lbl'), 20 * (1 - outQ(span(t, 0.2, 0.9))), lo);
  // legenda sob as logos
  const co = span(t, 8.0, 8.6) * (1 - span(t, 14.6, 15));
  setT($('cap'), 26 * (1 - outQ(span(t, 8.0, 8.7))), co);

  // manchete, linha a linha, subindo de dentro da máscara
  const out = span(t, 11.85, 12.25);
  [['h1', 8.35], ['h2', 8.5], ['h3', 8.65]].forEach(([id, t0], i) => {
    const sp = $(id).firstElementChild, u = outQ(span(t, t0, t0 + 0.55)), uo = inOutC(span(t, 11.85 + i * 0.05, 12.2 + i * 0.05));
    sp.style.transform = `translateY(${((1 - u) * 110 - uo * 110).toFixed(1)}%)`;
  });
  // lista de recursos: uma por batida
  const kids = $('tick').children;
  for (let i = 0; i < kids.length; i++) {
    const t0 = T_TICK + i * 0.5, last = i === kids.length - 1;
    const ui = inOutC(span(t, t0, t0 + 0.3)), uo = last ? inOutC(span(t, 11.85, 12.15)) : inOutC(span(t, t0 + 0.5, t0 + 0.8));   // rolo de caça-níquel: entra e sai juntos
    kids[i].style.transform = `translateY(${((1 - ui) * 90 - uo * 90).toFixed(1)}px)`;
    kids[i].style.opacity = (t >= t0 ? 1 : 0) * (1 - uo);
  }
  // final
  const e1 = outQ(span(t, 12.2, 12.8)), e2 = outBack(span(t, 12.55, 13.0)), e3 = span(t, 12.9, 13.4);
  setT($('e1'), 60 * (1 - e1), e1);
  setT($('e2'), 0, Math.min(1, e2 * 1.4), 0.6 + 0.4 * e2 + (t > 13.5 ? 0.025 * Math.sin((t - 13.5) * 6.283 / 1) : 0));
  setT($('e3'), 20 * (1 - e3), e3 * 0.9);
}
window.seek = seek;

if (!window.__RENDER__) {
  const t0 = performance.now();
