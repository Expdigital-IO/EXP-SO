<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Bipa + EXP · Feed animado</title>
<style>
  @font-face{font-family:Geist;src:url(fonts/Geist-Regular.woff2) format('woff2');font-weight:400}
  @font-face{font-family:Geist;src:url(fonts/Geist-Medium.woff2) format('woff2');font-weight:500}
  @font-face{font-family:Geist;src:url(fonts/Geist-SemiBold.woff2) format('woff2');font-weight:600}
  @font-face{font-family:GeistMono;src:url(fonts/GeistMono-Regular.woff2) format('woff2');font-weight:400}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#050404;color:#fff;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .abs{position:absolute}
  #bg{position:absolute;inset:0;background:
    radial-gradient(700px 600px at 22% 26%, rgba(110,60,230,.16), transparent 70%),
    radial-gradient(760px 640px at 80% 30%, rgba(255,77,0,.16), transparent 70%),
    radial-gradient(900px 500px at 50% 112%, rgba(255,77,0,.12), transparent 70%), #050404}
  canvas{position:absolute;left:0;top:0;width:1080px;height:1350px}
  #glow{filter:blur(18px);opacity:.95;mix-blend-mode:screen}
  .mono{font-family:GeistMono,monospace;text-transform:uppercase;letter-spacing:.26em}
  .lbl{left:0;width:1080px;text-align:center;font-size:24px;color:#FF7433;top:70px}
  .lbl i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#FF4D00;box-shadow:0 0 16px #FF4D00;margin-right:16px;vertical-align:2px}
  h1{left:0;width:1080px;top:752px;text-align:center;font-size:94px;line-height:1.0;font-weight:600;letter-spacing:-.045em;text-transform:uppercase}
  h1 em{font-style:normal;color:#FF4D00}
  .chips{left:90px;width:900px;top:1068px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;list-style:none}
  .chips li{font-size:25px;color:#EDE6E1;border:1.5px solid rgba(255,255,255,.16);background:rgba(20,15,13,.6);border-radius:99px;padding:11px 22px}
  .chips li b{color:#FF4D00;font-weight:600}
  .foot{left:64px;right:64px;top:1250px;display:flex;justify-content:space-between;font-size:21px;color:rgba(255,255,255,.62)}
  .foot span:last-child{color:#FF7433}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="glow" width="540" height="675"></canvas>
<canvas id="cv" width="2160" height="2700"></canvas>
<h1 class="abs">Operação<br>financeira<br><em>sob medida.</em></h1>
<ul class="abs chips">
  <li>Pix recorrente</li><li>Links personalizados</li><li>Suporte qualificado</li>
  <li>Time de dev <b>EXP</b> de prontidão</li><li>Módulo financeiro sob medida</li>
</ul>
<div class="abs mono foot"><span>Bipa Business <b style="color:#FF4D00">+</b> EXP Digital</span><span>expdigital.io/bipa</span></div>
<script>
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
// ---------- PRNG determinístico (o render precisa ser igual em todo quadro)
let seed = 20261124;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function gauss() { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// ---------- Desenho: Bipa em cima, EXP embaixo (mesmos traços da página)
const SB = 0.7, BW = 1.1, BX = 34 - 30 * SB * BW, BY = 128 - 10 * SB;
const ES = 4.8, EX = 548 - 9.5 * ES, EY = 196;
const mapB = (x, y) => [BX + x * SB * BW, BY + y * SB];
const mapE = (x, y) => [EX + x * ES, EY + y * ES];
const mapId = (x, y) => [x, y];
const ORANGE = [[0, '#FF4D00'], [0.6, '#FF7433'], [1, '#FF9C74']];
const SPIRAL = [[0, '#5BD04A'], [0.17, '#E8D51E'], [0.3, '#F9B81C'], [0.42, '#FA8A2A'], [0.52, '#FF4B4B'], [0.62, '#D53F9E'], [0.72, '#9A3BDE'], [0.86, '#6B42EE'], [1, '#3B84F0']];
const B0 = mapB(60, 65), B1 = mapB(60, 610), E0 = mapE(9.5, 57);
const segs = [
  { d: `M -60 60 C 0 90, ${B0[0] - 90} ${B0[1] - 60}, ${B0[0] - 40} ${B0[1] - 8} S ${B0[0] - 8} ${B0[1]}, ${B0[0]} ${B0[1]}`, map: mapId, w: 5, kind: 'lead', grad: [[0, '#2a4a1e'], [1, '#5BD04A']], g: 0 },
  { d: 'M60 65 C 250 10, 640 30, 640 200 C 640 330, 470 405, 280 405 C 120 405, 30 380, 30 335 C 30 285, 150 265, 290 265 C 470 265, 650 340, 650 470 C 650 600, 470 640, 300 640 C 190 640, 110 625, 60 610', map: mapB, w: 62 * SB, kind: 'band', grad: SPIRAL, g: 0 },
  { d: `M${B1[0]} ${B1[1]} C ${B1[0] + 160} ${B1[1] + 60}, ${E0[0] - 120} ${E0[1] + 120}, ${E0[0]} ${E0[1]}`, map: mapId, w: 8, kind: 'thread', grad: [[0, '#3B84F0'], [0.5, '#C04BE0'], [1, '#FF4D00']], g: 1 },
  { d: 'M9.5 57 A47.5 47.5 0 0 1 57 9.5 L95 9.5', map: mapE, w: 19 * ES, kind: 'band', grad: [[0, '#FF4D00'], [1, '#FF6A1F']], g: 2 },
  { d: 'M95 9.5 Q104 10 104.5 19', map: mapE, w: 6, kind: 'thread', grad: [[0, '#FF6A1F'], [1, '#FF6A1F']], g: 2 },
  { d: 'M104.5 19 A28.5 28.5 0 0 1 76 47.5 L45.87 47.5 A19 19 0 0 0 45.87 85.5 L76 85.5 A28.5 28.5 0 0 0 104.5 57', map: mapE, w: 19 * ES, kind: 'band', grad: ORANGE, g: 2 }
];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function gradAt(g, t) {
  for (let i = 1; i < g.length; i++) if (t <= g[i][0]) {
    const a = g[i - 1], b = g[i], k = (t - a[0]) / ((b[0] - a[0]) || 1), A = hex(a[1]), B = hex(b[1]);
    return [A[0] + (B[0] - A[0]) * k | 0, A[1] + (B[1] - A[1]) * k | 0, A[2] + (B[2] - A[2]) * k | 0];
  }
  return hex(g[g.length - 1][1]);
}
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('style', 'position:absolute;width:0;height:0'); document.body.appendChild(svg);
let total = 0;
for (const s of segs) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', s.d); svg.appendChild(p);
  const L = p.getTotalLength(), N = 900, pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength(L * i / N); pts.push(s.map(q.x, q.y)); }
  let len = 0; for (let i = 1; i <= N; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  s.pts = pts; s.len = len; s.weight = len * (s.kind === 'thread' ? 0.6 : s.kind === 'lead' ? 0.35 : 1); total += s.weight;
}
svg.remove();
let acc = 0; for (const s of segs) { s.t0 = acc / total; acc += s.weight; s.t1 = acc / total; }
function sample(s, u) {
  const f = u * (s.pts.length - 1), i = Math.min(s.pts.length - 2, f | 0), k = f - i;
  const a = s.pts[i], b = s.pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
  return { x: a[0] + dx * k, y: a[1] + dy * k, nx: -dy / m, ny: dx / m };
}
function headAt(P) {
  for (const s of segs) if (P <= s.t1) { const u = (P - s.t0) / ((s.t1 - s.t0) || 1); return { p: sample(s, u), c: gradAt(s.grad, u), g: s.g, u }; }
  const l = segs[segs.length - 1]; return { p: sample(l, 1), c: gradAt(l.grad, 1), g: l.g, u: 1 };
}

// partículas
const parts = [];
for (const s of segs) {
  const n = Math.round(s.kind === 'band' ? s.len * s.w * (s.g === 2 ? 0.036 : 0.05) : s.len * (s.kind === 'lead' ? 0.9 : 1.5));
  for (let i = 0; i < n; i++) {
    const u = rnd(), pt = sample(s, u);
    const off = s.kind === 'band' ? (rnd() - 0.5) * s.w * 0.94 + gauss() * s.w * 0.05 : gauss() * s.w * 0.35;
    const c = gradAt(s.grad, u);
    parts.push({ g: s.g, gu: u, t: s.t0 + u * (s.t1 - s.t0), x: pt.x + pt.nx * off, y: pt.y + pt.ny * off,
      r: s.kind === 'band' ? 1.1 + rnd() * 1.3 : 0.9 + rnd() * 0.8,
      a: s.kind === 'band' ? 0.45 + rnd() * 0.55 : s.kind === 'lead' ? 0.3 + rnd() * 0.35 : 0.5 + rnd() * 0.4,
      ph: rnd() * 6.283, sp: 0.8 + rnd() * 2.2, bx: gauss(), by: gauss(),
      c: `rgb(${(c[0] >> 3) << 3},${(c[1] >> 3) << 3},${(c[2] >> 3) << 3})` });
  }
}
parts.sort((a, b) => a.t - b.t);
// poeira de fundo

// ---------- Loop animado: a luz percorre a Bipa, a EXP e desce contornando o texto
const PERIOD = 7, TAU = 6.283185307;
const X0 = 84, Y0 = 728, X1 = 996, Y1 = 1212, RR = 58;
function samplePath(d, n) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d);
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sv.appendChild(p); document.body.appendChild(sv);
  const L = p.getTotalLength(), out = [];
  for (let i = 0; i <= n; i++) { const q = p.getPointAtLength(L * i / n); out.push([q.x, q.y]); }
  sv.remove(); return out;
}
const EEND = mapE(104.5, 57);
const conn = samplePath(`M${EEND[0]} ${EEND[1]} C ${EEND[0] + 14} ${EEND[1] + 110}, ${X1} ${Y0 + RR - 120}, ${X1} ${Y0 + RR}`, 200);
const rect = samplePath(`M${X1} ${Y0 + RR} L${X1} ${Y1 - RR} A${RR} ${RR} 0 0 1 ${X1 - RR} ${Y1} L${X0 + RR} ${Y1} A${RR} ${RR} 0 0 1 ${X0} ${Y1 - RR} L${X0} ${Y0 + RR} A${RR} ${RR} 0 0 1 ${X0 + RR} ${Y0} L${X1 - RR} ${Y0} A${RR} ${RR} 0 0 1 ${X1} ${Y0 + RR}`, 1400);
const FRAMEG = [[0, '#FF4D00'], [0.2, '#FF4B4B'], [0.38, '#D53F9E'], [0.55, '#6B42EE'], [0.7, '#3B84F0'], [0.82, '#5BD04A'], [0.92, '#E8D51E'], [1, '#FF4D00']];
// trilho único: traços das logos + conexão + moldura, com cor e comprimento acumulado
const track = []; let sAcc = 0;
function addPts(pts, colorAt, kind) {
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (track.length) { const l = track[track.length - 1]; sAcc += Math.hypot(p[0] - l.x, p[1] - l.y); }
    track.push({ x: p[0], y: p[1], s: sAcc, c: colorAt(i / (pts.length - 1)), kind });
  }
}
const segS = [];
segs.forEach(sg => { segS.push(sAcc); addPts(sg.pts, u => gradAt(sg.grad, u), 'logo'); });
const S_CONN = sAcc; addPts(conn, u => gradAt([[0, '#FF9C74'], [1, '#FF4D00']], u), 'conn');
const S_RECT = sAcc; addPts(rect, u => gradAt(FRAMEG, u), 'rect');
const S_TOT = sAcc;
// posição de cada partícula no trilho + cintilar periódico (loop perfeito)
for (const q of parts) {
  let i = segs.findIndex(sg => q.t <= sg.t1 + 1e-9); if (i < 0) i = segs.length - 1;
  const sg = segs[i], u = (q.t - sg.t0) / ((sg.t1 - sg.t0) || 1);
  q.s = segS[i] + u * sg.len; q.sp = (1 + ((q.ph * 1000) | 0) % 3) * TAU / PERIOD;
}
// partículas da moldura
const fparts = [];
for (let i = 0; i < 1500; i++) {
  const v = rnd(), k = Math.min(rect.length - 2, (v * (rect.length - 1)) | 0), a = rect[k], b = rect[k + 1];
  const dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1, off = gauss() * 3.2;
  const c = gradAt(FRAMEG, v);
  fparts.push({ x: a[0] - dy / m * off, y: a[1] + dx / m * off, s: S_RECT + v * (S_TOT - S_RECT), r: 0.7 + rnd() * 0.9, a: 0.2 + rnd() * 0.25,
    ph: rnd() * TAU, sp: (1 + ((rnd() * 3) | 0)) * TAU / PERIOD, c: `rgb(${c[0]},${c[1]},${c[2]})` });
}
function pointAt(s) {
  let lo = 0, hi = track.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (track[m].s < s) lo = m; else hi = m; }
  const a = track[lo], b = track[hi], k = (s - a.s) / ((b.s - a.s) || 1);
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, c: a.c, kind: a.kind };
}
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const gl = document.getElementById('glow').getContext('2d');
const em = document.querySelector('h1 em'), h1 = document.querySelector('h1');
const TRAIL = 340;

function seek(t) {
  const ph = ((t % PERIOD) + PERIOD) % PERIOD / PERIOD;
  const ease = x => x - Math.sin(x * TAU) / TAU * 0.25;          // respira: acelera e desacelera de leve
  const H = ease(ph) * S_TOT;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.globalCompositeOperation = 'lighter';
  // brilho que a luz deixa ao passar (decai ao longo de ~1 volta)
  const glowAt = s => { let d = H - s; if (d < 0) d += S_TOT; return d < 40 ? 1 : Math.exp(-(d - 40) / 520); };
  let lastC = '';
  for (const q of parts) {
    const tw = 0.7 + 0.3 * Math.sin(t * q.sp + q.ph), g = glowAt(q.s);
    if (q.c !== lastC) { ctx.fillStyle = q.c; lastC = q.c; }
    ctx.globalAlpha = Math.min(1, q.a * 1.3 * tw + g * 0.55);
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 0.85 * (1 + g * 0.45), 0, TAU); ctx.fill();
  }
  // moldura: linha-base fina + partículas que acendem com a luz
  ctx.lineWidth = 1.2;
  for (let i = 1; i < rect.length; i += 1) {
    const a = rect[i - 1], b = rect[i], v = i / (rect.length - 1), c = gradAt(FRAMEG, v), g = glowAt(S_RECT + v * (S_TOT - S_RECT));
    ctx.globalAlpha = 0.10 + g * 0.5; ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  lastC = '';
  for (const q of fparts) {
    const tw = 0.6 + 0.4 * Math.sin(t * q.sp + q.ph), g = glowAt(q.s);
    if (q.c !== lastC) { ctx.fillStyle = q.c; lastC = q.c; }
    ctx.globalAlpha = Math.min(1, q.a * tw + g * 0.85);
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1 + g * 0.6), 0, TAU); ctx.fill();
  }
  // a luz: risco brilhante com cauda
  ctx.lineCap = 'round';
  const STEPS = 40; let prev = null;
  for (let j = 0; j <= STEPS; j++) {
    let s = H - TRAIL * (1 - j / STEPS); if (s < 0) s += S_TOT;
    const p = pointAt(s), f = j / STEPS;
    if (prev && Math.hypot(p.x - prev.x, p.y - prev.y) < 60) {
      ctx.globalAlpha = 0.08 + 0.92 * f * f;
      ctx.strokeStyle = `rgb(${Math.round(p.c[0] + (255 - p.c[0]) * f * .85)},${Math.round(p.c[1] + (255 - p.c[1]) * f * .85)},${Math.round(p.c[2] + (255 - p.c[2]) * f * .85)})`;
      ctx.lineWidth = 0.8 + 3.6 * f; ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    prev = p;
  }
  const hp = pointAt(H), R = 30, gr = ctx.createRadialGradient(hp.x, hp.y, 0, hp.x, hp.y, R);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, `rgba(${hp.c},.6)`); gr.addColorStop(1, `rgba(${hp.c},0)`);
  ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(hp.x, hp.y, R, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  gl.clearRect(0, 0, 540, 675); gl.drawImage(cv, 0, 0, 540, 675);
  // o texto acende quando a luz passa pela moldura
  const onRect = H > S_RECT ? Math.sin(Math.PI * (H - S_RECT) / (S_TOT - S_RECT)) : 0;
  em.style.textShadow = `0 0 ${18 + 30 * onRect}px rgba(255,77,0,${(0.35 + 0.5 * onRect).toFixed(3)})`;
  h1.style.textShadow = `0 0 40px rgba(255,170,120,${(0.08 + 0.18 * onRect).toFixed(3)})`;
}
window.seek = seek;
if (!window.__RENDER__) {
  const t0 = performance.now();
  (function loop() { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
} else { seek(0); }
</script>
</body>
</html>
